name: Oyun içi çekim

# Oyunu sanal ekranda açar, cekim/sahne veri paketindeki sahneyi oynatır ve videoya kaydeder.
# Sonuç "cekimler" dalına konur.
on:
  push:
    branches: [main]
    paths: ["cekim/**", ".github/workflows/cekim.yml", "build.gradle"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  cekim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Araçlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool ffmpeg libgl1-mesa-dri mesa-utils x11-utils pulseaudio bc > /dev/null

      - name: Dünyayı oluştur (düz dünya)
        run: |
          chmod +x gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'level-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\nlevel-seed=1915\n' > run/server.properties
          ./gradlew runServer --no-daemon > server.log 2>&1 &
          for i in $(seq 1 120); do grep -q "Done (" server.log && break; sleep 5; done
          grep "Done (" server.log
          pkill -f "net.fabricmc" || true
          sleep 8
          mkdir -p run/saves
          mv run/world run/saves/korku
          mkdir -p run/saves/korku/datapacks
          cp -r cekim/sahne run/saves/korku/datapacks/sahne
          cp cekim/options.txt run/options.txt

      - name: Oyunu aç ve kaydet
        env:
          SAHNE: "1"
          DISPLAY: ":99"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp +extension GLX &
          # Oyunun sesini kaydetmek için sanal ses kartı
          pulseaudio -D --exit-idle-time=-1 || true
          sleep 2
          pactl load-module module-null-sink sink_name=kayit || true
          pactl set-default-sink kayit || true
          sleep 2
          glxinfo -B | head -12 || true
          ./gradlew runClient --no-daemon > client.log 2>&1 &
          # Dünyaya girilmesini bekle (ilk seferde oyun dosyaları iniyor)
          for i in $(seq 1 180); do
            grep -q -E "joined the game|Started serving on" client.log && break
            grep -q -E "Crash report|Game crashed|---- Minecraft Crash Report" client.log && break
            sleep 5
          done
          tail -5 client.log
          sleep 4
          mkdir -p cikti
          {
            echo "== ortam"; echo "DISPLAY=$DISPLAY"
            echo "== java süreçleri"; pgrep -af java | cut -c1-300
            for pid in $(pgrep -f KnotClient; pgrep -f "net.fabricmc.devlaunchinjector"); do echo "pid $pid DISPLAY=$(tr '\0' '\n' < /proc/$pid/environ | grep ^DISPLAY)"; done
            echo "== pencereler"; xwininfo -root -tree
            echo "== xdotool"; xdotool search --name "Minecraft"; xdotool search --class "java"
          } > cikti/debug.txt 2>&1 || true
          WIN=$(xdotool search --name "Minecraft" | tail -1 || true)
          echo "pencere: $WIN"
          mkdir -p cikti
          # Görüntü + oyun sesi kaydı, aynı anda oyuncu girdileri
          ffmpeg -y -loglevel error -f x11grab -video_size 1280x720 -framerate 30 -i :99 \
            -f pulse -i kayit.monitor -t 42 -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 160k cikti/sahne.mp4 &
          FF=$!
          bash cekim/oyna.sh "$WIN" > cikti/oyna.log 2>&1 &
          wait $FF || {
            echo "sesli kayıt olmadı, sessiz deneniyor"
            ffmpeg -y -loglevel error -f x11grab -video_size 1280x720 -framerate 30 -i :99 -t 42 -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p cikti/sahne.mp4
          }
          ffmpeg -y -loglevel error -i cikti/sahne.mp4 -vf fps=1/3 cikti/kare_%02d.png
          pkill -f "net.fabricmc" || true
          grep -E "ERROR|Exception|korkumodu" client.log | head -60 > cikti/hatalar.txt || true
          tail -c 150000 client.log > cikti/client.log
          ls -la cikti

      - name: Çekimleri yayımla
        if: always()
        run: |
          mkdir -p cikti && cd cikti
          [ -f client.log ] || tail -c 150000 ../client.log > client.log 2>/dev/null || true
          git init -q -b cekimler
          git config user.name "korku-modu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Çekim #${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:cekimler
